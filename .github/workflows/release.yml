name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签，例如 v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 自检 + 打包 APK + 发 Releases
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 准备 Node（模拟器）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 模拟运行自检（不通过就不打包）
        run: node simulator/run.js

      - name: 准备 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 直接用 runner 镜像预装的 Android SDK，不额外引入 setup-android action
      - name: 定位并准备 Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            for d in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/Android/Sdk"; do
              [ -d "$d" ] && SDK="$d" && break
            done
          fi
          echo "SDK=$SDK"
          test -d "$SDK"
          ls -1 "$SDK"
          SM=""
          for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" \
                   "$SDK/cmdline-tools/bin/sdkmanager" \
                   "$SDK/tools/bin/sdkmanager" \
                   "$(command -v sdkmanager || true)"; do
            [ -x "$c" ] && SM="$c" && break
          done
          echo "sdkmanager=$SM"
          test -n "$SM"
          sudo chown -R "$(id -u):$(id -g)" "$SDK" || true
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          "$SM" --list_installed | head -30

      - name: 编译 debug APK（自带 debug 签名，可直接安装）
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: 校验并重命名产物
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "DouyinFloatParser-${{ github.event.inputs.tag || github.ref_name }}.apk"
          ls -lh DouyinFloatParser-*.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 抖音悬浮解析 ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: DouyinFloatParser-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 失败时把诊断写回仓库文件，便于从 API 直接读取（不依赖日志重定向）
      - name: 失败时回传诊断
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "run=${{ github.run_id }} sha=${{ github.sha }}"
            echo "== android env =="
            env | grep -i android || true
            echo "== sdk list =="
            sdkmanager --list_installed 2>&1 | head -40 || true
            echo "== gradle log (tail 150) =="
            tail -150 /tmp/gradle.log 2>/dev/null || echo "(no gradle log)"
          } > /tmp/diag.txt
          B64=$(python3 -c "import base64;print(base64.b64encode(open('/tmp/diag.txt','rb').read()).decode())")
          SHA=$(gh api "repos/${{ github.repository }}/contents/ci-diag.txt?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api -X PUT "repos/${{ github.repository }}/contents/ci-diag.txt" \
              -f message="ci diag" -f content="$B64" -f branch=main -f sha="$SHA" || true
          else
            gh api -X PUT "repos/${{ github.repository }}/contents/ci-diag.txt" \
              -f message="ci diag" -f content="$B64" -f branch=main || true
          fi
