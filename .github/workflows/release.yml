name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签，例如 v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 自检 + 打包 APK + 发 Releases
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 准备 Node（模拟器）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 模拟运行自检（不通过就不打包）
        run: node simulator/run.js

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 platform / build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      - name: 编译 debug APK（自带 debug 签名，可直接安装）
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 校验并重命名产物
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "DouyinFloatParser-${{ github.event.inputs.tag || github.ref_name }}.apk"
          ls -lh DouyinFloatParser-*.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: 抖音悬浮解析 ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: DouyinFloatParser-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
